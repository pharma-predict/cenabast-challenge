name: 'Continuous Delivery'

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: prj-challenge-fs
  REGION: southamerica-west1
  REPOSITORY: challenge-repo
  SERVICE_NAME: cenabast-challenge-11178384
  SERVICE_ACCOUNT: sa-check-api-11178384@prj-challenge-fs.iam.gserviceaccount.com
  IMAGE: southamerica-west1-docker.pkg.dev/prj-challenge-fs/challenge-repo/cenabast-challenge-11178384

jobs:
  deploy:
    name: Build, push and deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --service-account ${{ env.SERVICE_ACCOUNT }}